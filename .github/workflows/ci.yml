# AAASeed CI — Mac-only PR gate (c152-P refit for Qt6 Studio)
#
# Mac-only by design : Studio is Qt6 + macOS Metal (foreign NSView). No
# Windows / Linux runners in the chain. The job is machine-aware :
#   - parallelism scales with `sysctl -n hw.ncpu` (no fixed -jN)
#   - the headless GH-hosted macos-14 runner has no on-screen surface,
#     so Metal-windowed tests are skipped ; offscreen Qt is forced
#   - if a future runner offers a real GPU, Metal-windowed tests can
#     re-enable via the GH_RUNNER_HAS_GPU env var

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qt6-studio:
    name: macOS arm64 — Qt6 Studio build + tests
    # macos-14 = Apple Silicon (M1). Project enforces arm64.
    runs-on: macos-14
    timeout-minutes: 30

    env:
      BUILD_DIR: out/macos-arm64-debug
      QT_PLUGIN_PATH: /opt/homebrew/share/qt/plugins
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Detect machine capacity
        id: machine
        run: |
          NCPU=$(sysctl -n hw.ncpu)
          MEMGB=$(( $(sysctl -n hw.memsize) / 1024 / 1024 / 1024 ))
          # Headless GH runners have no on-screen Metal surface ; only
          # opt in if explicitly set (future-proofing).
          GPU="${GH_RUNNER_HAS_GPU:-no}"
          echo "ncpu=$NCPU"   >> "$GITHUB_OUTPUT"
          echo "memgb=$MEMGB" >> "$GITHUB_OUTPUT"
          echo "gpu=$GPU"     >> "$GITHUB_OUTPUT"
          echo "::notice::Runner has $NCPU CPUs, ${MEMGB} GB RAM, gpu=$GPU"

      - name: Install toolchain (CMake + Ninja + Qt6)
        run: |
          brew update
          brew install cmake ninja qt
          cmake --version
          ninja --version
          /opt/homebrew/opt/qt/bin/qmake -v

      - name: Show toolchain
        run: |
          sw_vers
          uname -m
          xcodebuild -version || true
          clang --version | head -1

      - name: Configure (Debug, arm64, Ninja)
        run: |
          cmake -S . -B "${BUILD_DIR}" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0

      - name: Build aaaseed_app_qt + tests (jobs scoped to runner)
        # `--parallel` with no arg lets CMake/Ninja read the runner's
        # core count — no hardcoded -jN that'd starve smaller runners
        # or under-utilize bigger ones.
        run: |
          cmake --build "${BUILD_DIR}" \
            --target aaaseed_app_qt \
                     aaa_qt_studio_model_test \
                     aaa_qt_panel_models_test \
                     aaa_qt_lua_helper_test \
                     aaa_qt_settings_model_test \
            --parallel

      - name: Run Qt6 Studio test suites (offscreen QPA)
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          set -e
          for t in aaa_qt_studio_model_test \
                   aaa_qt_panel_models_test \
                   aaa_qt_lua_helper_test \
                   aaa_qt_settings_model_test; do
            echo "::group::$t"
            ./bin/$t
            echo "::endgroup::"
          done

      - name: Metal-windowed tests (skipped on headless runner)
        if: steps.machine.outputs.gpu == 'yes'
        working-directory: ${{ env.BUILD_DIR }}
        continue-on-error: true
        run: |
          # Reserved for tests that need a real CAMetalLayer drawable.
          # The GH-hosted macos-14 runner has a software Metal device
          # but no window-server surface, so these are normally skipped.
          ctest -L "metal-windowed" --output-on-failure || true

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs-${{ github.run_id }}
          path: |
            ${{ env.BUILD_DIR }}/Testing/
          if-no-files-found: ignore
          retention-days: 14
