# AAASeed for Mac -- docs site (MkDocs Material) build + deploy.
#
# Triggered on pushes to main that touch docs/ or this workflow file, and
# can be invoked manually via the Actions tab.
#
# Deploys to GitHub Pages using the official upload-pages-artifact /
# deploy-pages flow. Requires Pages to be enabled in repo Settings -> Pages
# with source set to "GitHub Actions".

name: docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# Required for the deploy-pages action.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent docs deployment, and do NOT cancel in-progress
# runs (we want every published commit to finish deploying so the live site
# always matches the last successful build).
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: build + deploy MkDocs site
    runs-on: ubuntu-latest
    timeout-minutes: 15

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install MkDocs + plugins
        run: |
          python -m pip install --upgrade pip
          pip install \
            mkdocs-material \
            mkdocs-mermaid2-plugin \
            pymdown-extensions

      - name: Resolve mkdocs config path
        id: cfg
        run: |
          if [ -f docs/mkdocs.yml ]; then
            echo "config=docs/mkdocs.yml" >> "$GITHUB_OUTPUT"
          elif [ -f mkdocs.yml ]; then
            echo "config=mkdocs.yml" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No mkdocs.yml found at docs/mkdocs.yml or repo root."
            exit 1
          fi

      - name: Build MkDocs site
        run: mkdocs build --strict --config-file "${{ steps.cfg.outputs.config }}" --site-dir _site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
