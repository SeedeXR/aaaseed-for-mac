# AAASeed for Mac — release workflow (c152-P refit for Qt6 Studio)
#
# Builds AAASeed-Studio-X.Y.Z.dmg via scripts/ship-qt-dmg.sh, verifies
# it via scripts/verify-qt-dmg.sh, packages a source tarball via
# git archive, then attaches both to a GitHub Release for the pushed
# tag.
#
# Trigger : tag push matching `v*` (e.g. v0.0.1) or workflow_dispatch.
#
# Honest scope : the produced DMG is UNSIGNED and UN-NOTARIZED. See
# SHIP_CHECKLIST.md for the signing / notarization runbook.

name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag (e.g., v0.0.1). Must already exist on the default branch.'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # 1. Build the Qt6 DMG on macos-14 (Apple Silicon) and verify.
  # ---------------------------------------------------------------------------
  build-dmg:
    name: build + verify Qt6 DMG
    runs-on: macos-14
    timeout-minutes: 45

    outputs:
      dmg-name: ${{ steps.build.outputs.dmg-name }}
      tag-name: ${{ steps.resolve-tag.outputs.tag }}
      version:  ${{ steps.resolve-tag.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0   # full history so `git archive` is stable.

      - name: Resolve tag + version
        id: resolve-tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          if [ -z "$TAG" ]; then
            echo "::error::Could not resolve release tag."
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG"       >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved tag=$TAG version=$VERSION"

      - name: Detect machine capacity
        run: |
          NCPU=$(sysctl -n hw.ncpu)
          MEMGB=$(( $(sysctl -n hw.memsize) / 1024 / 1024 / 1024 ))
          echo "::notice::Release runner has $NCPU CPUs, ${MEMGB} GB RAM"

      - name: Verify toolchain
        run: |
          sw_vers
          uname -m
          xcodebuild -version || true
          cmake --version
          which hdiutil

      - name: Install CMake + Ninja + Qt6
        run: |
          brew update
          brew install cmake ninja qt
          cmake --version
          ninja --version
          /opt/homebrew/opt/qt/bin/qmake -v

      - name: Build Qt6 DMG via scripts/ship-qt-dmg.sh
        id: build
        env:
          BUILD_TYPE: Release
        run: |
          chmod +x scripts/ship-qt-dmg.sh
          ./scripts/ship-qt-dmg.sh
          DMG="$(ls out/AAASeed-Studio-*.dmg | head -1)"
          if [ ! -f "$DMG" ]; then
            echo "::error::ship-qt-dmg.sh did not produce out/AAASeed-Studio-*.dmg."
            ls -la out/ || true
            exit 1
          fi
          echo "dmg-name=$(basename "$DMG")" >> "$GITHUB_OUTPUT"
          echo "dmg-path=$DMG"                >> "$GITHUB_OUTPUT"
          echo "Built : $DMG"

      - name: Verify DMG structure + runtime bundled
        run: |
          chmod +x scripts/verify-qt-dmg.sh
          ./scripts/verify-qt-dmg.sh "${{ steps.build.outputs.dmg-path }}"

      - name: Runtime smoke (3 frames) on headless Metal — non-blocking
        # GH-hosted macos-14 has a software Metal device. If the
        # platform refuses to create a drawable for headless run we
        # don't block the release ; the verifier already confirmed
        # the binary is structurally present.
        continue-on-error: true
        run: |
          DMG="${{ steps.build.outputs.dmg-path }}"
          MNT=/tmp/ci_qt_mnt
          hdiutil attach -nobrowse -mountpoint "$MNT" "$DMG"
          "$MNT/AAASeed Studio.app/Contents/Resources/runtime/aaaseed_runtime.app/Contents/MacOS/aaaseed_runtime" --max-frames 3 || \
            echo "::warning::Runtime smoke failed under headless Metal — not blocking."
          hdiutil detach "$MNT"

      - name: Create source tarball
        run: |
          VERSION="${{ steps.resolve-tag.outputs.version }}"
          TARBALL="aaaseed-for-mac-${VERSION}-src.tar.gz"
          git archive \
            --format=tar.gz \
            --prefix="aaaseed-for-mac-${VERSION}/" \
            -o "$TARBALL" \
            HEAD
          ls -la "$TARBALL"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            out/AAASeed-Studio-*.dmg
            aaaseed-for-mac-*-src.tar.gz
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 2. Publish the GitHub Release with both artifacts attached.
  # ---------------------------------------------------------------------------
  publish-release:
    name: publish GitHub Release
    needs: build-dmg
    runs-on: macos-14
    timeout-minutes: 10

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: artifacts

      - name: Flatten artifact layout
        run: |
          find artifacts -type f -name 'AAASeed-Studio-*.dmg'         -exec mv {} artifacts/ \;
          find artifacts -type f -name 'aaaseed-for-mac-*-src.tar.gz' -exec mv {} artifacts/ \;
          ls -la artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-dmg.outputs.tag-name }}
          name:    AAASeed Studio ${{ needs.build-dmg.outputs.tag-name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/AAASeed-Studio-*.dmg
            artifacts/aaaseed-for-mac-*-src.tar.gz
          body: |
            ## AAASeed Studio — Qt6 + QML Mac release

            Apple Silicon arm64 build (Homebrew Qt 6 is arm64-only ; Intel
            Macs can run under Rosetta).

            ### Quick install

            1. Download `AAASeed-Studio-*.dmg` (asset below).
            2. Double-click to mount.
            3. Drag **AAASeed Studio.app** to the `Applications` symlink.
            4. On first launch, clear the quarantine bit:
               ```
               xattr -d com.apple.quarantine "/Applications/AAASeed Studio.app"
               ```
            5. Launch via `/Applications/AAASeed Studio.app`.

            ### Verify your download

            ```
            tar xzf aaaseed-for-mac-*-src.tar.gz
            cd aaaseed-for-mac-*
            ./scripts/verify-qt-dmg.sh /path/to/AAASeed-Studio-*.dmg
            ```

            The verifier confirms the DMG mounts, contains AAASeed Studio.app
            with all required Qt frameworks, the nested aaaseed_runtime.app,
            the starter project, and the icon.

            ### Honest scope

            **Unsigned and un-notarized.** The `xattr` step above is required
            for first launch on a machine that downloaded the DMG through a
            browser. See `SHIP_CHECKLIST.md` for the signing / notarization
            runbook (requires an Apple Developer ID).
